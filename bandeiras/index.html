<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeiras dos Países</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto lg:max-w-screen-lg">
        <h1 class="text-center text-2xl my-8 font-bold">
            Bandeiras dos Países
        </h1>

        <input 
            type="text" 
            id="search"
            placeholder="Buscar país..."
            class="w-full p-3 mb-6 rounded border"
        />

        <div id="flags-cards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Cards inseridos via JS -->
        </div>
    </div>

    <script src="./js/main.js" type="module"></script>
</body>
</html>
